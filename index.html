<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verizon App Clip</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #f4f7fb;
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 650;
    }
    p {
      margin: 0 0 20px;
      color: #b7c2d4;
      line-height: 1.45;
    }
    label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      color: #b7c2d4;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #2a3a55;
      border-radius: 12px;
      background: #121b2d;
      color: #f4f7fb;
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.4;
      resize: vertical;
    }
    textarea:focus {
      outline: 2px solid #4d7cff;
      border-color: #4d7cff;
    }
    a.button {
      display: block;
      padding: 16px 20px;
      border-radius: 14px;
      background: #ee0000;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 650;
      text-decoration: none;
    }
    a.button:active { transform: scale(0.98); }
    .qr-wrap {
      margin: 28px auto 0;
      padding: 16px;
      width: fit-content;
      background: #fff;
      border-radius: 16px;
    }
    canvas { display: block; }
    .hint {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #8b97ab;
    }
  </style>
</head>
<body>
  <main>
    <h1>Verizon App Clip</h1>
    <p>Paste a URL to replace the link, then tap Open or scan the QR.</p>
    <label for="url">App Clip URL</label>
    <textarea id="url" spellcheck="false" autocomplete="off"></textarea>
    <a class="button" id="clip" href="#">Open App Clip</a>
    <div class="qr-wrap">
      <canvas id="qr"></canvas>
    </div>
    <p class="hint">Scan to open the App Clip on iPhone</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

    const field = document.getElementById("url");
    const clip = document.getElementById("clip");
    const canvas = document.getElementById("qr");

    function applyUrl(raw) {
      const url = raw.trim();
      if (!url) return;
      clip.href = url;
      QRCode.toCanvas(canvas, url, { width: 280, margin: 1, errorCorrectionLevel: "L" });
    }

    field.value = DEFAULT_URL;
    applyUrl(DEFAULT_URL);
    field.addEventListener("input", () => applyUrl(field.value));
  </script>
</body>
</html>
