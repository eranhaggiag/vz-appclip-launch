<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verizon App Clip</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #f4f7fb;
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 650;
    }
    p {
      margin: 0 0 20px;
      color: #b7c2d4;
      line-height: 1.45;
    }
    label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      color: #b7c2d4;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #2a3a55;
      border-radius: 12px;
      background: #121b2d;
      color: #f4f7fb;
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.4;
      resize: vertical;
    }
    textarea:focus {
      outline: 2px solid #4d7cff;
      border-color: #4d7cff;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a.button, button.button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 14px;
      background: #ee0000;
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }
    button.button {
      background: #4d7cff;
    }
    a.button:active, button.button:active { transform: scale(0.98); }
    .btn-hint {
      margin: -4px 0 0;
      font-size: 0.75rem;
      color: #8b97ab;
    }
    .qr-wrap {
      margin: 28px auto 0;
      padding: 16px;
      width: fit-content;
      background: #fff;
      border-radius: 16px;
    }
    .qr-wrap img { display: block; width: 280px; height: 280px; }
    .hint {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #8b97ab;
    }
    .debug {
      margin-top: 24px;
      text-align: left;
      background: #121b2d;
      border: 1px solid #2a3a55;
      border-radius: 12px;
      padding: 12px;
    }
    .debug h2 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      color: #8b97ab;
      font-weight: 650;
    }
    .debug .meta, .debug pre {
      margin: 0;
      font-size: 0.72rem;
      line-height: 1.45;
      color: #c5d0e0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .debug pre {
      max-height: 220px;
      overflow: auto;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Verizon App Clip</h1>
    <p>Paste a URL to replace the link, then tap Open or scan the QR.</p>
    <label for="url">App Clip URL</label>
    <textarea id="url" spellcheck="false" autocomplete="off"></textarea>
    <div class="buttons">
      <a class="button" id="clip" href="#">Open App Clip</a>
      <p class="btn-hint">&lt;a href&gt; — native link</p>
      <button class="button" id="sdkOpen" type="button">Open via window.location.href</button>
      <p class="btn-hint">same as the SDK</p>
    </div>
    <div class="qr-wrap">
      <img id="qr" alt="App Clip QR code">
    </div>
    <p class="hint">Scan to open the App Clip on iPhone</p>
    <section class="debug">
      <h2>Debug log (stays on this page)</h2>
      <p class="meta" id="debugMeta"></p>
      <pre id="debugLog"></pre>
    </section>
  </main>
  <script>
    const DEFAULT_URL = "https://appclip.apple.com/id?p=com.verizon.vzsecure.ProtectAppClip&X-Correlator=E480F4B1-0E4E-4DA9-828B-6BD8D7C5AD81&client_id=0oati5oy4oMdi1qks5d7&request=eyJhbGciOiJFUzI1NiIsImtpZCI6ImdsaWRlLXNpZ25pbmcta2V5LWVjZHNhLWVzMjU2LXVzLTIwMjYiLCJ0eXAiOiJvYXV0aC1hdXRoei1yZXErand0In0.eyJhdWQiOiJodHRwczovL2F1dGguc3Zjcy52ZXJpem9uLmNvbS92emNvbm5lY3QvIiwiY2xpZW50X2lkIjoiMG9hdGk1b3k0b01kaTFxa3M1ZDciLCJjcmVkZW50aWFsX2lkcyI6WyJhY21lIl0sImVuY3J5cHRlZF9yZXNwb25zZV9lbmNfdmFsdWVzX3N1cHBvcnRlZCI6WyJBMTI4R0NNIl0sImV4cCI6MTc4NjU3MDU5NSwiaWF0IjoxNzg2NTcwMjk1LCJpc3MiOiIwb2F0aTVveTRvTWRpMXFrczVkNyIsImp0aSI6IjRjMTVkZDQzLTc2ZTMtNGZhZS1hMGNhLTQ5ZWNjM2YyMmQ0NSIsImp3a3MiOnsia2V5cyI6W3siYWxnIjoiRUNESC1FUyIsImNydiI6IlAtMjU2Iiwia2lkIjoiMDg4MjU3N2UtNjU5ZC00MTU2LWE1ZGYtOWQ1Y2VjNzg4ZGE5Iiwia3R5IjoiRUMiLCJ1c2UiOiJlbmMiLCJ4IjoiY1FTakFEVmZweDBWV1hoQWNOODFkemlla2QzcWhSMWJvQm4zbDluZmZpVSIsInkiOiJ6OTE0OWtHMHZ2UVowZ1NhNmEybDZ2WEZCbHNTT2hubW14YVhqcUR3RVRFIn1dfSwibm9uY2UiOiI0MGQ4NGYxOS1mMzM1LTQxNzUtYTFmOS02ODgzNDM5ZmZkY2YiLCJyZWRpcmVjdF91cmkiOiJodHRwczovL2FwaS1kZXYuZ2xpZGVpZGVudGl0eS5hcHAvb2F1dGgyL2JjYWxsYmFjayIsInJlc3BvbnNlX3R5cGUiOiJ2cF90b2tlbiIsInNjb3BlIjoib3BlbmlkIGRwdjpGcmF1ZFByZXZlbnRpb25BbmREZXRlY3Rpb24gbnVtYmVyLXZlcmlmaWNhdGlvbjp2ZXJpZnkiLCJzdGF0ZSI6ImdjcC11cy1kZXYxLjQ3YTk3YmUyZjg3NGYwYmYifQ.Q6Ba9RGxpnVobU1OUQydpas8R6zWVRSQX9PUAOI899ukd4TkX1NolzdkCqva5A-lIrcFB2YiorlaWze2WARW0A";
    const field = document.getElementById("url");
    const clip = document.getElementById("clip");
    const qr = document.getElementById("qr");
    const sdkOpen = document.getElementById("sdkOpen");
    const debugLog = document.getElementById("debugLog");
    const debugMeta = document.getElementById("debugMeta");
    const LOG_KEY = "clip-debug-log";

    function jwtExp(url) {
      try {
        const request = new URL(url).searchParams.get("request");
        if (!request) return "no request JWT";
        const b64 = request.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        const padded = b64 + "=".repeat((4 - (b64.length % 4)) % 4);
        const payload = JSON.parse(atob(padded));
        const exp = payload.exp * 1000;
        const left = Math.round((exp - Date.now()) / 1000);
        return left > 0 ? "JWT exp in " + left + "s" : "JWT EXPIRED " + Math.abs(left) + "s ago";
      } catch {
        return "JWT not parsed";
      }
    }

    function renderMeta() {
      debugMeta.textContent =
        "page: " + location.href + "\n" +
        "host: " + location.hostname + "\n" +
        "nav: " + (performance.getEntriesByType("navigation")[0] || {}).type + "\n" +
        jwtExp(field.value.trim() || DEFAULT_URL);
    }

    function log(msg) {
      const line = new Date().toISOString().slice(11, 23) + " " + msg;
      const prev = sessionStorage.getItem(LOG_KEY) || "";
      const next = (prev + "\n" + line).trim().split("\n").slice(-40).join("\n");
      sessionStorage.setItem(LOG_KEY, next);
      debugLog.textContent = next;
      renderMeta();
    }

    function applyUrl(raw) {
      const url = raw.trim();
      if (!url) return;
      clip.href = url;
      qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=280x280&ecc=L&data=" + encodeURIComponent(url);
      renderMeta();
    }

    clip.addEventListener("click", () => log("tap <a href> → " + clip.href.slice(0, 80) + "…"));
    sdkOpen.addEventListener("click", () => {
      const url = field.value.trim();
      if (!url) return;
      log("tap location.href → " + url.slice(0, 80) + "…");
      window.location.href = url;
    });

    window.addEventListener("pagehide", (e) => log("pagehide persisted=" + e.persisted));
    window.addEventListener("pageshow", (e) => log("pageshow persisted=" + e.persisted + " (bfcache=" + e.persisted + ")"));
    document.addEventListener("visibilitychange", () => log("visibility=" + document.visibilityState));

    field.value = DEFAULT_URL;
    applyUrl(DEFAULT_URL);
    field.addEventListener("input", () => applyUrl(field.value));
    debugLog.textContent = sessionStorage.getItem(LOG_KEY) || "";
    log("load " + location.hostname);
  </script>
</body>
</html>
